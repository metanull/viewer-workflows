name: Scheduled npm audit

on:
  workflow_call:

# github.token installs private @metanull packages, provided the package has
# granted this repository access ("Manage Actions access" in the package
# settings). No PAT or repository secret is involved.
permissions:
  contents: read
  issues: write
  packages: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Run npm audit
        id: audit
        run: |
          set +e
          npm audit > audit.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          {
            echo "## npm audit"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
      - name: Open or update the findings issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="npm audit findings"
          {
            echo "The scheduled \`npm audit\` run of $(date -u +%Y-%m-%d) reported vulnerabilities:"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
            echo ""
            echo "_This issue is maintained automatically by the scheduled audit workflow. It is updated in place on every run that still has findings._"
          } > issue-body.md
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq 'map(select(.title == "npm audit findings")) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue edit "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
