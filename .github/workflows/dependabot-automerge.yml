name: Dependabot auto-merge

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge safe updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
      # Auto-merge: minor/patch bumps of the reusable workflows themselves,
      # plus patch bumps of dev dependencies. Majors are left for a human.
      #
      # viewer-workflows is here because consumers pin it to an exact version
      # rather than a moving `v1` tag, so a release reaches them as a
      # Dependabot pull request. That PR runs this repository's full CI before
      # merging, which is the verification the old force-moved tag never had —
      # so letting a green minor/patch merge itself keeps propagation automatic
      # without giving up the check. Matching is on the repo name alone
      # ('viewer-workflows'), not 'owner/viewer-workflows' — the repo moved
      # from the metanull personal account to the museumwithnofrontiers org
      # once already, and matching only the name means the next such move
      # can't silently break this condition again.
      #
      # The published @museumwnf npm packages (viewer-core, viewer-layout,
      # viewer-i18n, the per-site data packages) are deliberately NOT listed
      # here either — not because Dependabot can't reach them (they publish
      # to the public npmjs registry, so no token is involved), but because
      # their rollout is a human decision: propagation is driven by the
      # operator running tools/propagate.mjs, which only opens a pull request
      # once a release is actually meant to reach sites. See MAINTENANCE.md.
      - name: Enable auto-merge
        if: >-
          (
            contains(steps.metadata.outputs.dependency-names, 'viewer-workflows') &&
            (
              steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
              steps.metadata.outputs.update-type == 'version-update:semver-patch'
            )
          ) ||
          (
            steps.metadata.outputs.dependency-type == 'direct:development' &&
            steps.metadata.outputs.update-type == 'version-update:semver-patch'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
