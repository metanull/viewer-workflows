name: Dependabot auto-merge

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge safe updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
      # Auto-merge: minor/patch bumps of the two platform packages and of the
      # reusable workflows themselves, plus patch bumps of dev dependencies.
      # Major bumps are left for a human.
      #
      # metanull/viewer-workflows is here because consumers pin it to an exact
      # version rather than a moving `v1` tag, so a release reaches them as a
      # Dependabot pull request. That PR runs this repository's full CI before
      # merging, which is the verification the old force-moved tag never had —
      # so letting a green minor/patch merge itself keeps propagation automatic
      # without giving up the check.
      - name: Enable auto-merge
        if: >-
          (
            (
              contains(steps.metadata.outputs.dependency-names, '@metanull/viewer-core') ||
              contains(steps.metadata.outputs.dependency-names, '@metanull/viewer-layout') ||
              contains(steps.metadata.outputs.dependency-names, 'metanull/viewer-workflows')
            ) &&
            (
              steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
              steps.metadata.outputs.update-type == 'version-update:semver-patch'
            )
          ) ||
          (
            steps.metadata.outputs.dependency-type == 'direct:development' &&
            steps.metadata.outputs.update-type == 'version-update:semver-patch'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
