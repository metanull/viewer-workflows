name: Locale validation

# The rules themselves are not here. They live in metanull/viewer-i18n, as one
# checker used by the dictionary, by every website's own texts, and by the call
# sites that read them — so a rule cannot be enforced in one place and forgotten
# in another. This workflow only decides which repository is being checked, and
# what to do with the result.

on:
  workflow_call:
    inputs:
      mode:
        description: "'site' for a website's locales/, 'dictionary' for the shared texts"
        type: string
        required: false
        default: site
      texts_path:
        description: >-
          Space-separated path prefixes holding texts. A pull request touching
          only these merges itself once the check is green.
        type: string
        required: false
        default: "locales/"
      dictionary_ref:
        description: "Ref of metanull/viewer-i18n providing the rules (site mode only)"
        type: string
        required: false
        default: main
    outputs:
      locales_only:
        description: "'true' when the pull request only touches text files"
        value: ${{ jobs.validate.outputs.locales_only }}

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    # The name is part of the branch-protection contract of every website that
    # requires `locales / Validate locale files`. Renaming it would leave those
    # repositories requiring a check that never reports again.
    name: Validate locale files
    runs-on: ubuntu-latest
    outputs:
      locales_only: ${{ steps.changes.outputs.locales_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEXTS_PATH: ${{ inputs.texts_path }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          changed="$(git diff --name-only "$merge_base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          only=true
          [ -z "$changed" ] && only=false
          for file in $changed; do
            matched=false
            for prefix in $TEXTS_PATH; do
              case "$file" in "$prefix"*) matched=true ;; esac
            done
            [ "$matched" = true ] || only=false
          done
          echo "locales_only=$only" >> "$GITHUB_OUTPUT"

      # In dictionary mode the caller IS the rulebook, so its own checker runs:
      # a pull request that changes a rule is validated by the rule it proposes.
      # A website borrows the published rulebook instead of installing it, which
      # keeps a translator's pull request free of npm, of registry credentials
      # and of anything that can fail for a reason they cannot act on.
      #
      # The path is relative on purpose: actions/checkout refuses any path that
      # is not under the workspace, so `$RUNNER_TEMP/...` fails outright with
      # "Repository path ... is not under ...". A relative path lands inside the
      # workspace, which is a fresh clone that nothing reads back — the checker
      # walks `locales/` and `src/`, never the working tree at large.
      - name: Fetch the rules
        if: inputs.mode != 'dictionary'
        uses: actions/checkout@v7
        with:
          repository: metanull/viewer-i18n
          ref: ${{ inputs.dictionary_ref }}
          path: .viewer-i18n-rules

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The checker reads Markdown with the same library the websites render it
      # with, rather than approximating the grammar with a regular expression,
      # so it needs that library present. This is the one install in a
      # translator's pull request and it is deliberately the smallest possible
      # one: `marked` has no dependencies of its own, it comes from the public
      # registry, and nothing here needs a credential.
      #
      # Both modes, because both run the checker from a plain checkout: site
      # mode from `.viewer-i18n-rules`, dictionary mode from the caller itself.
      # Guarding this on the mode is what failed first — the dictionary's own
      # texts job could no longer start.
      #
      # `|| true` because a checkout that predates the dependency has nothing
      # to install, and this workflow has to keep working against both. That is
      # what lets it be released, and pinned everywhere, before the checker
      # changes.
      - name: Install the rules' dependencies
        working-directory: ${{ inputs.mode == 'dictionary' && '.' || '.viewer-i18n-rules' }}
        run: npm ci --omit=dev || true

      - name: Validate texts
        id: validate
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "dictionary" ]; then
            node tools/check.mjs --dictionary .
          else
            node .viewer-i18n-rules/tools/check.mjs --site .
          fi

      - name: Explain failures on the PR
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file locale-problems.md \
            || gh pr comment "$PR_NUMBER" --body-file locale-problems.md

      - name: Enable auto-merge for text-only PRs
        if: steps.validate.outcome == 'success' && steps.changes.outputs.locales_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"

      - name: Fail the job when validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
