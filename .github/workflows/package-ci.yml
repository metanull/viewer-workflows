name: Package CI

on:
  workflow_call:

# github.token installs private @metanull packages, provided the package has
# granted this repository access ("Manage Actions access" in the package
# settings). No PAT or repository secret is involved.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Test
        run: npm run test

  pack:
    name: Pack tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run build --if-present
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 1

  dependents:
    name: Discover websites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      count: ${{ steps.read.outputs.count }}
    steps:
      # A website is, by definition, a repository created from
      # metanull/website-template — GitHub records that permanently as
      # `template_repository`. Deriving the list from it means a new site is a
      # downstream consumer the moment it exists, with no file to maintain.
      #
      # This replaces the hand-written dependents.json, which had to be edited
      # in BOTH package repos for every new site and was the source of a
      # standing maintenance trap.
      #
      # The list endpoint omits `template_repository`, so each repo needs its
      # own call. That is one request per repo the owner has, which is cheap
      # and well inside the rate limit.
      #
      # Blind spot, accepted knowingly: this finds repositories OWNED by the
      # template's owner that still carry the link. A site created by fork, or
      # transferred in from elsewhere, would not appear — so the resolved list
      # and its count are printed on every run, and an unexpected drop is
      # visible in the log.
      - name: Discover repositories created from the website template
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ github.repository_owner }}/website-template
        run: |
          set -euo pipefail
          repos="$(gh api "users/${{ github.repository_owner }}/repos?per_page=100&type=owner" \
            --paginate --jq '.[] | select(.archived == false) | .name')"
          found=""
          for repo in $repos; do
            template="$(gh api "repos/${{ github.repository_owner }}/$repo" \
              --jq '.template_repository.full_name // ""')"
            if [ "$template" = "$TEMPLATE" ]; then
              found="$found ${{ github.repository_owner }}/$repo"
            fi
          done
          matrix="$(printf '%s\n' $found | jq -R -s -c 'split("\n") | map(select(length > 0)) | sort')"
          count="$(echo "$matrix" | jq 'length')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## Websites discovered: $count"
            echo ""
            echo "$matrix" | jq -r '.[] | "- \(.)"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Discovered $count website(s) from $TEMPLATE:"
          echo "$matrix" | jq -r '.[] | "  \(.)"'
          if [ "$count" -eq 0 ]; then
            echo "::notice::No websites found - no downstream builds to run."
          fi

  downstream:
    name: "Downstream: ${{ matrix.repo }}"
    needs: [pack, dependents]
    if: needs.dependents.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.dependents.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/tarball
      - name: Install dependencies with this PR's package build
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm install --no-save "$RUNNER_TEMP"/tarball/*.tgz
      - name: Build dependent
        run: npm run build
      - name: Test dependent
        run: npm run test

  # Single stable status for the whole downstream matrix.
  #
  # Branch protection requires job NAMES, and the matrix names its jobs after
  # the websites it discovered — a set that changes whenever a site is created.
  # Requiring those directly would mean editing the protection settings of both
  # package repos every time: forget to add a context and the canary is
  # silently no longer required; forget to remove one and every pull request is
  # blocked by a check that will never report again.
  #
  # Require `ci / Downstream (all)` instead. It never changes, however many
  # websites exist, so creating one needs no settings change anywhere.
  #
  # `if: always()` because this has to report even when the matrix fails.
  downstream-success:
    name: Downstream (all)
    needs: [dependents, downstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Zero websites is a FAILURE, not a quiet pass.
      #
      # An empty matrix skips `downstream` entirely, and a skipped job reports
      # `skipped` — so treating that as success makes this check report green
      # while validating nothing. That is not hypothetical: deleting
      # dependents.json while the calling repository still pinned a version
      # that read it produced exactly this, and the whole downstream canary
      # went silently dark behind a green tick.
      #
      # There is no legitimate zero. The platform always has websites; a count
      # of none means discovery is broken.
      - name: Check that websites were discovered
        run: |
          count='${{ needs.dependents.outputs.count }}'
          echo "websites discovered: $count"
          if [ "$count" = "0" ] || [ -z "$count" ]; then
            echo "::error::No websites were discovered, so nothing was built downstream. \
          This check exists to prevent a package change merging unvalidated - \
          investigate the Discover websites job rather than bypassing this."
            exit 1
          fi
      - name: Check the downstream matrix
        run: |
          result='${{ needs.downstream.result }}'
          echo "downstream matrix result: $result"
          case "$result" in
            success) exit 0 ;;
            *) echo "::error::At least one downstream build failed - see the Downstream jobs."; exit 1 ;;
          esac
