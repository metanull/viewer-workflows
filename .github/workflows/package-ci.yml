name: Package CI

on:
  workflow_call:

# github.token installs private @metanull packages, provided the package has
# granted this repository access ("Manage Actions access" in the package
# settings). No PAT or repository secret is involved.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Test
        run: npm run test

  pack:
    name: Pack tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run build --if-present
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 1

  dependents:
    name: Read dependents.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      count: ${{ steps.read.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Read dependents.json
        id: read
        run: |
          if [ -f dependents.json ]; then
            matrix="$(jq -c . dependents.json)"
          else
            matrix="[]"
          fi
          count="$(echo "$matrix" | jq 'length')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::notice::dependents.json is empty - no downstream builds to run."
          fi

  downstream:
    name: "Downstream: ${{ matrix.repo }}"
    needs: [pack, dependents]
    if: needs.dependents.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.dependents.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/tarball
      - name: Install dependencies with this PR's package build
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm install --no-save "$RUNNER_TEMP"/tarball/*.tgz
      - name: Build dependent
        run: npm run build
      - name: Test dependent
        run: npm run test

  # Single stable status for the whole downstream matrix.
  #
  # Branch protection requires job NAMES, and the matrix names its jobs after
  # the repositories in dependents.json — so requiring them directly meant every
  # dependents.json edit also had to edit the protection settings of both
  # package repos. Forget to add the context and the canary is silently no
  # longer required; forget to remove one and every pull request is blocked by a
  # check that will never report again.
  #
  # Require `ci / Downstream (all)` instead. It never changes, however many
  # dependents there are, so adding a website is a one-line pull request.
  #
  # `if: always()` because this has to report even when the matrix fails, and
  # `skipped` counts as success because `downstream` is skipped when
  # dependents.json is empty.
  downstream-success:
    name: Downstream (all)
    needs: [downstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the downstream matrix
        run: |
          result='${{ needs.downstream.result }}'
          echo "downstream matrix result: $result"
          case "$result" in
            success|skipped) exit 0 ;;
            *) echo "::error::At least one downstream build failed - see the Downstream jobs."; exit 1 ;;
          esac
