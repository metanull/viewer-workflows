name: Package release

on:
  workflow_call:

# github.token installs private @metanull packages, provided the package has
# granted this repository access ("Manage Actions access" in the package
# settings). No PAT or repository secret is involved.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Align package version with the tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - name: Build
        run: npm run build --if-present
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
