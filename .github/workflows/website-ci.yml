name: Website CI

on:
  workflow_call:

# github.token installs private @metanull packages, provided the package has
# granted this repository access ("Manage Actions access" in the package
# settings). No PAT or repository secret is involved.
permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run build

  test:
    name: Test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Test
        run: npm run test

  # locale-validate.yml checks the texts a website writes; this checks the ones
  # it reads. It needs the installed dependencies, because the entries a call
  # site may use are the shared bundle plus the website's own file, and only an
  # install knows which bundle this website receives.
  texts:
    name: Texts (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Check that every text a page asks for exists
        run: npx viewer-i18n-check --app .

  lint:
    name: Lint (reported, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # setup-node registers the eslint-stylish problem matcher, so findings
      # surface as PR annotations; continue-on-error keeps the workflow green.
      - name: ESLint
        continue-on-error: true
        run: npm run lint

  audit:
    name: Audit (reported, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@metanull'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: npm audit
        continue-on-error: true
        run: |
          set +e
          audit_output="$(npm audit 2>&1)"
          status=$?
          {
            echo "## npm audit"
            echo ""
            echo '```'
            echo "$audit_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported vulnerabilities - see the Audit job summary for details."
          fi
          exit "$status"
