name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      base_path:
        description: Base path the site is built for (defaults to /<repo-name>/)
        required: false
        type: string

# github.token installs private @metanull packages, provided the package has
# granted this repository access ("Manage Actions access" in the package
# settings). No PAT or repository secret is involved.
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ inputs.base_path || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
