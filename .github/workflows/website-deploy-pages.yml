name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      base_path:
        description: Base path the site is built for (defaults to /<repo-name>/)
        required: false
        type: string
    secrets:
      PACKAGES_READ_TOKEN:
        description: >-
          Token with read:packages access to the @metanull scope on GitHub Packages.
          Optional - falls back to github.token, which reaches public @metanull
          packages; required once the repo consumes a private package.
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ inputs.base_path || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
